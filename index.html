<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلال مسائل التفاضل والتكامل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/algebrite/1.2.1/algebrite.bundle-for-browser.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --btn-color: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: var(--btn-color);
            color: var(--btn-text);
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
            min-height: 50px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>حلال التفاضل والتكامل 🧮</h2>
        <input type="text" id="expr" placeholder="أدخل المعادلة (مثال: x^2 + 3*x)">
        <button onclick="solve('diff')">اشتقاق (التفاضل)</button>
        <button onclick="solve('int')">تكامل (الرمزِي)</button>
        <div id="result">النتيجة ستظهر هنا...</div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        function solve(type) {
            const input = document.getElementById('expr').value;
            const resDiv = document.getElementById('result');
            if(!input) {
                resDiv.innerText = "يرجى إدخال معادلة أولاً!";
                return;
            }
            try {
                let ans = "";
                if (type === 'diff') {
                    ans = Algebrite.diff(input).toString();
                } else if (type === 'int') {
                    ans = Algebrite.integral(input).toString();
                }
                resDiv.innerText = "النتيجة: " + ans;
            } catch (e) {
                resDiv.innerText = "خطأ في صيغة المعادلة المدخلة.";
            }
        }
    </script>
</body>
</html>
